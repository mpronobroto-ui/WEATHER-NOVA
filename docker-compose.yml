version: "3.9"
services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=weathergpt
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./BACKEND/SQL:/docker-entrypoint-initdb.d
    restart: unless-stopped

  backend:
    build: ./BACKEND
    ports:
      - "8000:8000"
    env_file:
      - ./BACKEND/.env
    environment:
      - PYTHONUNBUFFERED=1
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DB=weathergpt
      - WIS2_ENABLE=true
    depends_on:
      - mysql
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ./FRONTEND:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
